<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{views/common/head :: head}"></head>
<body class="m-0 h-screen bg-white">

    <!-- 흰 배경 위에 뜨는 안내 모달: modal.html의 info 모달 마크업/클래스 재사용 -->
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-5">
        <div role="dialog" aria-modal="true"
             class="w-96 max-w-full overflow-hidden rounded-2xl bg-white shadow-2xl">
            <div class="px-7 pb-6 pt-7 text-center">
                <div class="mx-auto mb-3.5 flex h-12 w-12 items-center justify-center rounded-full bg-indigo-50 text-indigo-600">
                    <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5">
                        <path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
                    </svg>
                </div>
                <h2 class="mb-1.5 text-lg font-extrabold tracking-tight text-slate-900">알림</h2>
                <p class="text-sm leading-relaxed text-slate-500" th:text="${message}">삭제된 게시글입니다.</p>
            </div>
            <div class="px-5 pb-5">
                <button id="confirmBtn"
                        class="h-11 w-full rounded-xl bg-indigo-600 text-sm font-semibold text-white hover:bg-indigo-700">확인</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const redirectUrl = /*[[${redirectUrl}]]*/ '/';
        document.getElementById('confirmBtn').addEventListener('click', function () {
            window.location.href = redirectUrl;
        });
    </script>
</body>
</html>
